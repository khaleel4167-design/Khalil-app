name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # يوتيوب يحتاج محرك جافاسكربت: نبني QuickJS لأندرويد وندمجه في التطبيق
      - name: Build QuickJS for Android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          LATEST=$(git ls-remote --tags --refs https://github.com/quickjs-ng/quickjs 'v0.*' | sed 's#.*/##' | sort -V | tail -1)
          echo "quickjs-ng tag: $LATEST"
          git clone --depth 1 --branch "$LATEST" https://github.com/quickjs-ng/quickjs qjs-src \
            || git clone --depth 1 https://github.com/quickjs-ng/quickjs qjs-src
          cmake -S qjs-src -B qjs-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build qjs-build -j4 --target qjs_exe || cmake --build qjs-build -j4
          BIN=$(find qjs-build -maxdepth 2 -type f -name qjs | head -1)
          file "$BIN"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libqjs.so

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Eman.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Eman.apk
          path: Eman.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Eman.apk --title "إيمان $TAG" --notes "نسخة جديدة من تطبيق إيمان" --latest
